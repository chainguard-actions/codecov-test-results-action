name: Test file and directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy test result file
        run: |
          mkdir -p /tmp/test-results
          echo '<testsuites></testsuites>' > /tmp/test-results/results.xml
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          file: /tmp/test-results/results.xml
          files: /tmp/test-results/results.xml
          directory: /tmp/test-results
          disable_search: "false"
          exclude: node_modules
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with file/directory inputs (dry_run mode)"
          echo "PASS"
