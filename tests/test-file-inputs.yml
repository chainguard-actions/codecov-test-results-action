name: Test file-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy test result files
        run: |
          mkdir -p test-results
          cat > test-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites><testsuite name="test" tests="1"><testcase name="test1"/></testsuite></testsuites>
          EOF
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          dry_run: "true"
          handle_no_reports_found: "true"
          file: test-results/junit.xml
          files: test-results/junit.xml
          directory: test-results
          disable_search: "false"
          exclude: node_modules
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with file inputs"
          echo "PASS"
