name: Test file-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy test result file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="example" tests="1" failures="0">
              <testcase name="test_example" classname="example"/>
            </testsuite>
          </testsuites>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          file: "/tmp/test-results/results.xml"
          files: "/tmp/test-results/results.xml"
          directory: "/tmp/test-results"
          exclude: "node_modules"
          disable_search: "false"
          env_vars: "OS,PYTHON"
          report_code: "test-report"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action completed with file inputs (dry_run mode)"
          echo "PASS"
