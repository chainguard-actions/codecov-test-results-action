name: Test file and directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy test result file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="example" tests="1" failures="0">
              <testcase name="test_example" classname="example"/>
            </testsuite>
          </testsuites>
          EOF
      - id: action
        uses: .
        with:
          token: "fake-token-for-testing"
          dry_run: "true"
          handle_no_reports_found: "true"
          directory: "/tmp/test-results"
          disable_search: "false"
          exclude: "/tmp/exclude-dir"
          file: "/tmp/test-results/results.xml"
          files: "/tmp/test-results/results.xml"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with file/directory inputs"
          echo "PASS"
