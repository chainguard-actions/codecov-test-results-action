name: Test advanced and enterprise inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory and codecov yml
        run: |
          mkdir -p /tmp/workdir
          cat > /tmp/codecov.yml <<'EOF'
          codecov:
            require_ci_to_pass: no
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          codecov_yml_path: /tmp/codecov.yml
          env_vars: OS,PYTHON
          fail_ci_if_error: "false"
          os: linux
          report_code: test-report
          root_dir: /tmp/workdir
          slug: myorg/myrepo
          url: https://codecov.io
          working-directory: /tmp/workdir
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with advanced inputs (dry_run mode)"
          echo "PASS"
