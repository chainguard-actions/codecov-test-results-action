name: Test advanced and enterprise inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download codecov CLI binary for binary input test
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov || true
          chmod +x codecov 2>/dev/null || true
          ls -la codecov 2>/dev/null || echo "binary not downloaded, continuing"
      - name: Create dummy codecov yml
        run: |
          mkdir -p /tmp/codecov-config
          cat > /tmp/codecov-config/codecov.yml <<'EOF'
          codecov:
            require_ci_to_pass: false
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          codecov_yml_path: /tmp/codecov-config/codecov.yml
          commit_parent: abc1234def5678901234567890123456789012ab
          report_code: test-report
          root_dir: "."
          slug: myorg/myrepo
          url: https://codecov.io
          use_oidc: "false"
          os: linux
          binary: ""
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action completed with advanced inputs (dry_run mode)"
          echo "PASS"
