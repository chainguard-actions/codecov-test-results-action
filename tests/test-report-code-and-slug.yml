name: Test report_code, root_dir, slug, url, and version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          report_code: "my-report-code"
          root_dir: "/tmp"
          slug: "myorg/myrepo"
          url: "https://codecov.example.com"
          version: "latest"
          handle_no_reports_found: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry_run mode with report_code/root_dir/slug/url/version inputs)"
          echo "PASS"
