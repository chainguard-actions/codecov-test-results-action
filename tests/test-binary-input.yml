name: Test binary input (pre-downloaded CLI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake codecov binary
        run: |
          mkdir -p /tmp/fake-codecov-bin
          cat > /tmp/fake-codecov-bin/codecov <<'EOF'
          #!/bin/sh
          # Fake codecov CLI for testing
          echo "Fake codecov CLI invoked with args: $*"
          exit 0
          EOF
          chmod +x /tmp/fake-codecov-bin/codecov
      - id: action
        uses: .
        with:
          binary: "/tmp/fake-codecov-bin/codecov"
          dry_run: "true"
          handle_no_reports_found: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with binary input"
