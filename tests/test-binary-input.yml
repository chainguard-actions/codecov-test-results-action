name: Test binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download codecov CLI binary
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov || true
          chmod +x codecov 2>/dev/null || true
          ls -la codecov 2>/dev/null || echo "Binary download skipped"
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          binary: ./codecov
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with binary input"
          echo "PASS"
