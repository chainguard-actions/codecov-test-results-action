name: Test binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake binary for testing
        run: |
          cat > /tmp/codecov-fake <<'EOF'
          #!/bin/sh
          echo "Fake codecov CLI called with args: $@"
          exit 0
          EOF
          chmod +x /tmp/codecov-fake
      - id: action
        uses: .
        with:
          binary: /tmp/codecov-fake
          dry_run: "true"
          handle_no_reports_found: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with binary input"
          echo "PASS"
