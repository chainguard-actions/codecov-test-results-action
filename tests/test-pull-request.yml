name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          fail_ci_if_error: "false"
          flags: "unit"
          name: "pr-test-upload"
          override_pr: "1"
          override_branch: "feature-branch"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully in pull request context"
          echo "PASS"
