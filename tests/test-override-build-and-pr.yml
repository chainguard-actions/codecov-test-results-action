name: Test override_build, override_build_url, override_commit, and override_pr inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          override_build: "12345"
          override_build_url: "https://ci.example.com/builds/12345"
          override_commit: "abc1234def5678901234567890123456789012ab"
          override_pr: "42"
          handle_no_reports_found: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry_run mode with override_build/override_build_url/override_commit/override_pr inputs)"
          echo "PASS"
