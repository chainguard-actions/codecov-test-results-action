name: Test disable_search, env_vars, files, and os inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy test result files
        run: |
          cat > /tmp/result1.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="suite1" tests="1" failures="0">
              <testcase name="test_one" classname="suite1"/>
            </testsuite>
          </testsuites>
          EOF
          cat > /tmp/result2.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="suite2" tests="1" failures="0">
              <testcase name="test_two" classname="suite2"/>
            </testsuite>
          </testsuites>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          disable_search: "true"
          files: "/tmp/result1.xml,/tmp/result2.xml"
          env_vars: "OS,PYTHON"
          os: "linux"
          handle_no_reports_found: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry_run mode with disable_search/env_vars/files/os inputs)"
          echo "PASS"
