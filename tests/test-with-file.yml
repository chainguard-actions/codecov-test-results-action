name: Test with specific test result file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sample JUnit XML test result
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="example" tests="2" failures="0" errors="0" time="0.5">
              <testcase name="test_one" classname="ExampleTest" time="0.1"/>
              <testcase name="test_two" classname="ExampleTest" time="0.4"/>
            </testsuite>
          </testsuites>
          EOF
      - id: action
        uses: .
        with:
          file: "/tmp/test-results/junit.xml"
          dry_run: "true"
          fail_ci_if_error: "false"
          disable_search: "true"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with specific file in dry-run mode"
          echo "PASS"
