name: Test with specific file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JUnit XML test result file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="example" tests="1" failures="0" errors="0" time="0.1">
              <testcase name="test_example" classname="example" time="0.1"/>
            </testsuite>
          </testsuites>
          EOF
      - id: action
        uses: .
        with:
          dry_run: "true"
          file: "/tmp/test-results/junit.xml"
          token: "fake-token-for-dry-run"
          flags: "unit"
          name: "test-upload"
      - name: Assert action completed with file input
        run: |
          echo "Action completed successfully with specific file input in dry_run mode"
          echo "PASS"
