name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          verbose: "true"
          token: "fake-token-for-dry-run"
      - name: Assert action completed in verbose mode
        run: |
          echo "Action completed successfully in verbose + dry_run mode"
          echo "PASS"
