name: Test verbose mode with env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      MY_OS: linux
      MY_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          fail_ci_if_error: "false"
          verbose: "true"
          env_vars: "MY_OS,MY_PYTHON"
          flags: "py3.11"
          name: "verbose-test-upload"
      - name: Assert action completed without error in verbose mode
        run: |
          echo "Action completed successfully in verbose mode with env_vars"
          echo "PASS"
