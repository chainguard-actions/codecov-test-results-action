name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          override_branch: "main"
          override_build: "42"
          override_build_url: "https://example.com/builds/42"
          override_commit: "abc1234def5678901234567890123456789012ab"
          override_pr: "99"
          dry_run: "true"
          handle_no_reports_found: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with override inputs"
