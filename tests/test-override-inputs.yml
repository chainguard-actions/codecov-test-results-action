name: Test override and enterprise inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry_run: "true"
          handle_no_reports_found: "true"
          override_branch: "main"
          override_build: "42"
          override_build_url: "https://example.com/builds/42"
          override_commit: "abc1234def5678901234567890123456789012ab"
          override_pr: "123"
          commit_parent: "def5678901234567890123456789012345678abc"
          slug: "myorg/myrepo"
          url: "https://codecov.io"
          os: "linux"
          root_dir: "."
          codecov_yml_path: ".codecov.yml"
          use_oidc: "false"
          binary: ""
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action completed with override inputs (dry_run mode)"
          echo "PASS"
