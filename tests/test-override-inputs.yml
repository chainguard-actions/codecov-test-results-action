name: Test override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          dry_run: "true"
          handle_no_reports_found: "true"
          fail_ci_if_error: "false"
          override_branch: main
          override_build: "42"
          override_build_url: https://example.com/builds/42
          override_commit: abc1234def5678901234567890123456789012ab
          override_pr: "1"
          commit_parent: abc1234def5678901234567890123456789012ab
          report_code: my-report
          flags: unit
          name: my-upload
          env_vars: OS,PYTHON
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with override inputs"
          echo "PASS"
