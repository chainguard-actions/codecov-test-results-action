name: Test verbose mode and override_branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Codecov CLI binary that checks verbose and branch override
        run: |
          mkdir -p /tmp/fake-codecov-bin
          cat > /tmp/fake-codecov-bin/codecov << 'EOF'
          #!/bin/sh
          echo "Fake Codecov CLI invoked with args: $*"
          found_verbose=0
          found_branch=0
          prev=""
          for arg in "$@"; do
            if [ "$arg" = "-v" ]; then
              found_verbose=1
            fi
            if [ "$prev" = "-B" ] && [ "$arg" = "main" ]; then
              found_branch=1
            fi
            prev="$arg"
          done
          if [ "$found_verbose" = "0" ]; then
            echo "ERROR: -v (verbose) not found in args"
            exit 1
          fi
          if [ "$found_branch" = "0" ]; then
            echo "ERROR: -B main (override_branch) not found in args"
            exit 1
          fi
          echo "Verbose and override_branch args verified. Success."
          exit 0
          EOF
          chmod +x /tmp/fake-codecov-bin/codecov

      - name: Run action with verbose and override_branch
        id: action
        uses: .
        with:
          binary: /tmp/fake-codecov-bin/codecov
          verbose: "true"
          override_branch: "main"
          dry_run: "true"
          handle_no_reports_found: "true"
          fail_ci_if_error: "true"

      - name: Assert action completed successfully
        run: |
          echo "Action completed with verbose and override_branch"
          echo "PASS"
