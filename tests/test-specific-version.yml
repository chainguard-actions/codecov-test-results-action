name: Test specific CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample JUnit XML test result
        run: |
          mkdir -p /tmp/versioned-results
          cat > /tmp/versioned-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="VersionedSuite" tests="1" failures="0" errors="0" time="0.2">
              <testcase name="test_versioned" classname="VersionedSuite" time="0.2"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/versioned-results/junit.xml
          dry_run: "true"
          disable_search: "true"
          version: "latest"
          verbose: "true"

      - name: Assert action completed with specific version
        run: |
          echo "Action completed successfully with version=latest in dry-run mode"
          echo "PASS"
