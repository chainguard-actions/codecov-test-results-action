name: Test env_vars, exclude, report_code, root_dir, slug, url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          env_vars: "OS,PYTHON"
          exclude: "vendor"
          report_code: "test-report"
          root_dir: "/tmp"
          slug: "myorg/myrepo"
          url: "https://codecov.io"
          dry_run: "true"
          handle_no_reports_found: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with env_vars, exclude, report_code, root_dir, slug, url inputs"
