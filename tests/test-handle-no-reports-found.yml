name: Test handle no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: /tmp/nonexistent-reports-dir
          disable_search: "false"
          handle_no_reports_found: "true"
          dry_run: "true"
          verbose: "true"
      - name: Assert action completed without error when no reports found
        run: |
          echo "Action completed successfully with handle_no_reports_found=true"
          echo "PASS"
