name: Test basic dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample JUnit XML test result
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="ExampleSuite" tests="2" failures="0" errors="0" time="0.5">
              <testcase name="test_pass_one" classname="ExampleSuite" time="0.1"/>
              <testcase name="test_pass_two" classname="ExampleSuite" time="0.4"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          file: /tmp/test-results/junit.xml
          dry_run: "true"
          disable_search: "true"
          verbose: "true"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
