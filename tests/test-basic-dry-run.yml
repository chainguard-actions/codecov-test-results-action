name: Test basic dry run with test result file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JUnit XML test result file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="example tests" tests="2" failures="0" errors="0" time="1.0">
            <testsuite name="suite1" errors="0" failures="0" skipped="0" timestamp="2025-01-01T00:00:00" time="1.0" tests="2">
              <testcase classname="TestClass" name="test_pass_1" time="0.5"/>
              <testcase classname="TestClass" name="test_pass_2" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          file: test-results/junit.xml
          dry_run: "true"
          verbose: "true"
          fail_ci_if_error: "false"

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
