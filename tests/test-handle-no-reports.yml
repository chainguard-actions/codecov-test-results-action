name: Test handle no reports found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          directory: /tmp/no-reports-here
          handle_no_reports_found: "true"
          dry_run: "true"
          fail_ci_if_error: "false"

      - name: Assert action completed without failure when no reports found
        run: |
          echo "Action completed without error when no reports found (handle_no_reports_found=true)"
          echo "PASS"
