name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          dry_run: "true"
          handle_no_reports_found: "true"
          verbose: "true"
          version: "latest"
          working-directory: "."
          flags: "unit"
          name: "test-upload"
          fail_ci_if_error: "false"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action completed (dry_run mode, no reports expected)"
          echo "PASS"
