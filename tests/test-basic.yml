name: Test basic usage with core inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          dry_run: "true"
          handle_no_reports_found: "true"
          version: latest
          verbose: "true"
          working-directory: "."
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry_run mode)"
          echo "PASS"
