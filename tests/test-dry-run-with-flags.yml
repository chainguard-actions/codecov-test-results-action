name: Test dry run with flags and name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML test result files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit1.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="suite-a" tests="1" failures="0" errors="0" time="0.5">
            <testsuite name="SuiteA" errors="0" failures="0" skipped="0" timestamp="2025-01-01T00:00:00" time="0.5" tests="1">
              <testcase classname="SuiteA" name="test_a" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF
          cat > "$GITHUB_WORKSPACE/test-results/junit2.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="suite-b" tests="1" failures="0" errors="0" time="0.3">
            <testsuite name="SuiteB" errors="0" failures="0" skipped="0" timestamp="2025-01-01T00:00:00" time="0.3" tests="1">
              <testcase classname="SuiteB" name="test_b" time="0.3"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        with:
          files: "test-results/junit1.xml,test-results/junit2.xml"
          flags: "unit"
          name: "my-test-upload"
          dry_run: "true"
          verbose: "true"
          fail_ci_if_error: "false"

      - name: Assert action completed with flags and name in dry-run mode
        run: |
          echo "Action completed with flags=unit and name=my-test-upload in dry-run mode"
          echo "PASS"
